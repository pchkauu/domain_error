name: domain_error
description: Domain errors with Either, Result, and captureResult for expected errors in Dart applications.
version: 3.0.0
repository: https://github.com/pchkauu/domain_error
homepage: https://github.com/pchkauu/domain_error
issue_tracker: https://github.com/pchkauu/domain_error/issues
topics:
  - error-handling
  - domain
  - exceptions
screenshots:
  - description: The complete journey from operation outcome through captureResult to fold.
    path: assets/overview.png
  - description: DomainError fields, feature hierarchy, and stable type identifiers.
    path: assets/flow.png
  - description: Async and sync APIs, Either branches, fold, and map behavior.
    path: assets/fold.png

environment:
  sdk: ^3.13.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  collection: ^1.18.0
  equatable: ^2.0.7
  meta: ^1.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
